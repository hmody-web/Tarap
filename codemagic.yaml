workflows:
  tarab-deep-fix-v6:
    name: Build Tarab DeepFix V6 ZIP
    instance_type: mac_mini_m2
    max_build_duration: 30

    scripts:
      - name: Build DeepFix V6 and diagnostics
        script: |
          chmod +x build_and_merge.sh inject_dylib.py
          ./build_and_merge.sh

    artifacts:
      - "Tarab_DeepFix_V6.zip"
