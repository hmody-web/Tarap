workflows:
  layout-cleaner-any-ipa:
    name: Build LayoutCleaner ANY IPA
    instance_type: mac_mini_m2
    max_build_duration: 30

    scripts:
      - name: Show repository files
        script: |
          pwd
          echo
          find . -maxdepth 5 -type f | sort

      - name: Build ANY IPA
        script: |
          chmod +x build_and_merge.sh
          chmod +x inject_dylib.py
          ./build_and_merge.sh

    artifacts:
      - "Tarab_5.11_LayoutCleaner_ANY_IPA.ipa"
