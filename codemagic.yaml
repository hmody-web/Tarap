workflows:
  trace-native-uiimage:
    name: Trace Native UIImage
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Resolve UIImage native call path
        script: |
          chmod +x scripts/trace_uiimage.sh
          ./scripts/trace_uiimage.sh
    artifacts:
      - uiimage_trace/**
