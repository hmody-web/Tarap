workflows:
  xcode-symbol-trace:
    name: Xcode Symbol Trace
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Trace Swift symbols with Xcode tools
        script: |
          chmod +x scripts/trace_symbols.sh
          ./scripts/trace_symbols.sh
    artifacts:
      - symbol_results/**
