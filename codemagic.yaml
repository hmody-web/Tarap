workflows:
  trace-native-uiimageview:
    name: Trace Native UIImageView
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Find native UIImageView sequence
        script: |
          chmod +x scripts/trace_native_uiimageview.sh
          ./scripts/trace_native_uiimageview.sh
    artifacts:
      - native_uiimageview_trace/**
