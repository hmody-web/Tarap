workflows:
  layout-cleaner:
    name: Build LayoutCleaner IPA
    instance_type: mac_mini_m2
    max_build_duration: 30

    scripts:
      - name: Show repository files
        script: |
          echo "Repository:"
          pwd
          echo
          find . -maxdepth 3 -type f | sort

      - name: Build and merge LayoutCleaner
        script: |
          chmod +x build_and_merge.sh
          chmod +x inject_dylib.py
          ./build_and_merge.sh

    artifacts:
      - "*.ipa"
