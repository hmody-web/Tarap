workflows:
  tarab-remote-banner:
    name: Tarab Remote API Banner
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Build and inject remote banner
        script: |
          chmod +x build_and_inject.sh inject_dylib.py
          ./build_and_inject.sh

    artifacts:
      - Tarab_RemoteBanner_Injected.ipa
