workflows:
  trace-selector-xrefs:
    name: Trace UIKit Selector Xrefs
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Resolve UIKit selector xrefs
        script: |
          chmod +x scripts/trace_selector_xrefs.sh
          ./scripts/trace_selector_xrefs.sh
    artifacts:
      - selector_xref_trace/**
