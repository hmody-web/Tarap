workflows:
  build-flexd-editable:
    name: Build Tarab with editable fleXD
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Build and inject latest fleXD
        script: |
          chmod +x build_and_inject.sh inject_dylib.py
          ./build_and_inject.sh

    artifacts:
      - Tarab_fleXD_Editable.ipa
