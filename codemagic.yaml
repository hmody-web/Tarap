workflows:
  layout-cleaner:
    name: Build LayoutCleaner IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Build and merge LayoutCleaner
        script: |
          chmod +x build_and_merge.sh
          ./build_and_merge.sh Tarab_5.11_ProfileOverlay_Merged.ipa Tarab_5.11_LayoutCleaner.ipa
    artifacts:
      - Tarab_5.11_LayoutCleaner.ipa
